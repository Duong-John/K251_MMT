<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chat</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background-color: #0d1117;
      color: white;
      font-family: Arial, sans-serif;
    }
    .chat-container {
      width: 600px;
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 80vh;
    }
    .messages {
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 15px;
      max-width: 75%;
    }
    .msg.me {
      background: #1976d2;
      align-self: flex-end;
    }
    .msg.other {
      background: #424242;
      align-self: flex-start;
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex-grow: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
    }
    .input-area button {
      background: #00bcd4;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <h2 id="chat-with">Chat</h2>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>
    <script>
    function initializeParams() {
      let params;
      if (window._QUERY_STRING) {
        console.log('[Debug] Using _QUERY_STRING from server:', window._QUERY_STRING);
        params = new URLSearchParams(window._QUERY_STRING);
      } else {
        console.log('Something went wrong');
        params = new URLSearchParams(window.location.search);
      }

      const target = params.get('target');
      const my_port = params.get('my_port');

      console.log("Chat target =", target);
      console.log("My port =", my_port);

      document.getElementById('chat-with').textContent = `Chat with ${target}`;

      const messagesDiv = document.getElementById('messages');
      const input = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');

        function appendMessage(who, text) {
          const msg = document.createElement('div');
          msg.className = `msg ${who}`;
          msg.textContent = text;
          messagesDiv.appendChild(msg);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function pollMessages() {
        try {
          const resp = await fetch(`http://127.0.0.1:${my_port}/poll?target=${encodeURIComponent(target)}`);
          const data = await resp.json();
          if (Array.isArray(data) && data.length > 0) {
            data.forEach(m => appendMessage('other', m.msg));
          }
        } catch (err) {
          console.error('Polling error:', err);
        }
      }

        sendBtn.addEventListener('click', async () => {
          const msg = input.value.trim();
          if (!msg) return;

          appendMessage('me', msg);
          input.value = '';

          try {
            const response = await fetch(`http://127.0.0.1:${my_port}/send-peer?target=${encodeURIComponent(target)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ msg })
            });

            const text = await response.text();
            console.log('[MiniServer Reply]', text);
          } catch (err) {
            console.error('Send failed:', err);
            appendMessage('other', '[Error] Cannot send message.');
          }
        });
      setInterval(pollMessages, 1000);
    }

    document.addEventListener('DOMContentLoaded', initializeParams);
    </script>


</body>
</html>
